# docker compose up --build
#
# Works from a clean clone with no .env: MOCK_LLM defaults to true, so the
# whole system runs offline. To use Gemini, copy .env.example to .env, set
# GEMINI_API_KEY and MOCK_LLM=false, and run the same command.

services:
  api:
    build: .
    command: uvicorn rng.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      MOCK_LLM: ${MOCK_LLM:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      DATA_DIR: ${DATA_DIR:-data/primary}
      DUCKDB_PATH: /app/store_data/rng.duckdb
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  ui:
    build: .
    command: streamlit run rng/ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false
    ports:
      - "8501:8501"
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
